<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="sans-serif">
  <title>Sum-of-fractions bar: Co-60 and H-3 fractions against the CI = 1 boundary</title>

<rect x="90.0" y="136.0" width="208.3" height="68" fill="#2563eb" fill-opacity="0.85" rx="4"/>
<rect x="298.3" y="136.0" width="104.2" height="68" fill="#d97706" fill-opacity="0.85" rx="4"/>
<text x="194.2" y="176.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">Co-60: 0.5</text>
<text x="350.4" y="176.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#ffffff">H-3: 0.25</text>
<line x1="402.5" y1="118.0" x2="402.5" y2="204.0" stroke="#2563eb" stroke-width="2"/>
<text x="402.5" y="110.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="#2563eb">CI = 0.75 &#x2713;</text>
<line x1="506.7" y1="118.0" x2="506.7" y2="200.0" stroke="var(--muted-foreground)" stroke-width="2" stroke-dasharray="7 4"/>
<text x="506.7" y="246.0" text-anchor="middle" font-size="12.5" font-weight="600" fill="var(--muted-foreground)">boundary CI = 1 (included)</text>
<line x1="90.0" y1="204.0" x2="90.0" y2="210.0" stroke="var(--muted-foreground)" stroke-width="1.25"/>
<text x="90.0" y="228.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">0</text>
<line x1="298.3" y1="204.0" x2="298.3" y2="210.0" stroke="var(--muted-foreground)" stroke-width="1.25"/>
<text x="298.3" y="228.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">0.5</text>
<line x1="506.7" y1="204.0" x2="506.7" y2="210.0" stroke="var(--muted-foreground)" stroke-width="1.25"/>
<text x="506.7" y="228.0" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">1</text>
<rect x="150" y="286" width="340" height="44" rx="10" fill="#fef3c7"/>
<text x="320" y="304" text-anchor="middle" font-size="12" font-weight="600" fill="#b45309">worked example: 0.05/0.1 + 25/100 = 0.75 &#x2264; 1</text>
<text x="320" y="322" text-anchor="middle" font-size="11.5" fill="#b45309">satisfied; Co-60 dominates at half its limit alone</text>
</svg>
