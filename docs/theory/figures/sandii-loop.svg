<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 400" role="img" font-family="sans-serif">
  <title>SAND-II iteration: fold, weigh, adjust, check convergence</title>

<rect x="30" y="40" width="150" height="76" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
<text x="105.0" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted-foreground)">guess &#x3c6;</text>
<text x="105.0" y="84" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">&#x3c6;ⱼ > 0</text>
<text x="105.0" y="104" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">strictly positive</text>
<rect x="245" y="40" width="150" height="76" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
<text x="320.0" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted-foreground)">S1 fold</text>
<text x="320.0" y="84" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">cᵢ = &#x3a3; Rᵢⱼ&#x3c6;ⱼ</text>
<text x="320.0" y="104" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">calculated rates</text>
<rect x="460" y="40" width="150" height="76" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
<text x="535.0" y="62" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted-foreground)">rate ratios</text>
<text x="535.0" y="84" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">Nᵢ / cᵢ</text>
<text x="535.0" y="104" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">measured / folded</text>
<rect x="30" y="190" width="150" height="76" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
<text x="105.0" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted-foreground)">S3 adjust</text>
<text x="105.0" y="234" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">&#x3c6; × geom. mean</text>
<text x="105.0" y="254" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">of corrections</text>
<rect x="245" y="190" width="150" height="76" rx="10" fill="var(--card)" stroke="var(--border)" stroke-width="1"/>
<text x="320.0" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted-foreground)">S2 weights</text>
<text x="320.0" y="234" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">Wⱼᵢ = Rᵢⱼ&#x3c6;ⱼ/cᵢ</text>
<text x="320.0" y="254" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">rate shares</text>
<rect x="460" y="190" width="150" height="76" rx="10" fill="#fef3c7" stroke="var(--border)" stroke-width="1"/>
<text x="535.0" y="212" text-anchor="middle" font-size="13" font-weight="600" fill="var(--muted-foreground)">converged?</text>
<text x="535.0" y="234" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">max |Δ&#x3c6;/&#x3c6;| &lt; tol</text>
<text x="535.0" y="254" text-anchor="middle" font-size="12" fill="var(--muted-foreground)">strictly below</text>
