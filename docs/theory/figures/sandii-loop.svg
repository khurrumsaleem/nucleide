<polyline points="610,228 630,228" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="630,228 622,224 622,232" fill="var(--muted-foreground)"/>
<text x="445" y="344" text-anchor="middle" font-size="11.5" fill="var(--muted-foreground)">yes: solution + diagnostics</text>
</svg>
