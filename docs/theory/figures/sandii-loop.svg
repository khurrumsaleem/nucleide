<polyline points="535,116 535,153 320,153 320,190" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="320,190 316,182 324,182" fill="var(--muted-foreground)"/>
<line x1="245" y1="228" x2="180" y2="228" stroke="var(--muted-foreground)" stroke-width="1.5"/>
<polygon points="180,228 188,224 188,232" fill="var(--muted-foreground)"/>
<polyline points="105,266 105,300 535,300 535,266" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="535,266 531,274 539,274" fill="var(--muted-foreground)"/>
<polyline points="560,267 560,352 20,352 20,78 32,78" fill="none" stroke="var(--muted-foreground)" stroke-width="1.5" stroke-linejoin="round" stroke-linecap="round"/>
<polygon points="32,78 24,74 24,82" fill="var(--muted-foreground)"/>
